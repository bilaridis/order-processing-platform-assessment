name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this step also enforces the analyzers.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      # Includes the architecture tests that enforce module boundaries.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The deployable artefact for App Service (zip deploy, run from package). Deployment to Azure is
      # added with the infrastructure; see deploy/README.md.
      - name: Publish host
        run: dotnet publish src/Host/OrderProcessing.Host/OrderProcessing.Host.csproj --configuration Release --output publish/core

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: core-services-${{ github.sha }}
          path: publish/core
